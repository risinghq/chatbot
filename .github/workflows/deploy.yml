name: Deploy

on:
  push:
    branches: ["master"]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # No deploy job starts unless the check passes, so a red commit never runs
  # the remote migrations.
  check:
    uses: ./.github/workflows/ci.yml

  # Lists the Workers whose inputs this push changed. A push compares against
  # the commit before it, so a push of several commits is judged as a whole.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - apps/backend/**
              - packages/intelligence/**
              - packages/types/**
              - packages/utils/**
              - packages/tsconfig/**
              - package.json
              - bun.lock
              - mise.toml
            dashboard:
              - apps/frontend/**
              - packages/types/**
              - packages/tsconfig/**
              - package.json
              - bun.lock
              - mise.toml

  # Migrations run before the new code, so the code never reads a column the
  # database does not have yet.
  backend:
    needs: [check, changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - run: bun install --frozen-lockfile

      - run: bun run --cwd apps/backend db:migrate:remote

      - run: bun run --cwd apps/backend deploy

  # The dashboard's service binding names the backend Worker, which must exist
  # first, so this job waits for the backend job when both run.
  dashboard:
    needs: [check, changes, backend]
    if: >-
      always() && needs.check.result == 'success' &&
      needs.changes.outputs.dashboard == 'true' && needs.backend.result !=
      'failure' && needs.backend.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - run: bun install --frozen-lockfile

      - run: bun run --cwd apps/frontend build

      - run: bun run --cwd apps/frontend deploy
